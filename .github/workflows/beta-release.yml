name: Create Beta Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  beta-release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python3 -m pip install packaging

      - name: Get current version and beta tag
        id: versions
        run: |
          import json
          from packaging import version
          import os
          from datetime import datetime
          
          # Get current version from manifest
          with open('custom_components/domru/manifest.json') as f:
              current_version = json.load(f)['version']
          
          print(f"current_version={current_version}")
          
          # Create beta version with timestamp
          # Format: v1.0.3-beta.20250125.1
          now = datetime.utcnow()
          date_str = now.strftime('%Y%m%d')
          
          # Try to get the latest beta tag for today
          import subprocess
          try:
              # Get all beta tags for today
              result = subprocess.check_output(
                  ["git", "tag", "-l", f"v{current_version}-beta.{date_str}.*"],
                  stderr=subprocess.DEVNULL,
                  text=True
              ).strip()
              
              beta_tags = result.split('\n') if result else []
              beta_tags = [t for t in beta_tags if t]
              
              if beta_tags:
                  # Get the latest beta tag and increment counter
                  latest_beta = sorted(beta_tags)[-1]
                  # Extract counter from tag like v1.0.3-beta.20250125.1
                  counter = int(latest_beta.split('.')[-1]) + 1
              else:
                  counter = 1
          except Exception:
              counter = 1
          
          beta_version = f"{current_version}-beta.{date_str}.{counter}"
          beta_tag = f"v{beta_version}"
          
          print(f"beta_version={beta_version}")
          print(f"beta_tag={beta_tag}")
          
          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'current_version={current_version}\n')
              f.write(f'beta_version={beta_version}\n')
              f.write(f'beta_tag={beta_tag}\n')
        shell: python3 {0}

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.versions.outputs.beta_tag }}
          name: Beta Version ${{ steps.versions.outputs.beta_version }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

