name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-quality:
    name: Check Code Quality
    uses: ./.github/workflows/lint.yml

  check-validate:
    name: Check Validation
    uses: ./.github/workflows/validate.yml

  release:
    name: Create Release
    needs: [check-quality, check-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python3 -m pip install packaging

      - name: Get current and previous versions
        id: versions
        run: |
          import json
          from packaging import version
          import os
          
          # Get current version from manifest
          with open('custom_components/domru/manifest.json') as f:
              current_version = json.load(f)['version']
          
          print(f"current_version={current_version}")
          
          # Try to get the latest stable tag. Beta tags from beta-release.yml use
          # provider-friendly versions like 1.1.0.b20260611.1, which are not
          # valid for packaging.version and must not block stable releases.
          import subprocess
          try:
              result = subprocess.check_output(
                  ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
                  stderr=subprocess.DEVNULL,
                  text=True
              ).strip()

              stable_tags = []
              for tag in result.splitlines():
                  tag_version = tag.lstrip('v')
                  try:
                      parsed = version.parse(tag_version)
                  except version.InvalidVersion:
                      continue

                  if not parsed.is_prerelease:
                      stable_tags.append(parsed)

              previous_version = str(max(stable_tags)) if stable_tags else "0.0.0"
          except subprocess.CalledProcessError:
              previous_version = "0.0.0"
          
          print(f"previous_version={previous_version}")
          
          # Compare versions
          current = version.parse(current_version)
          previous = version.parse(previous_version)
          should_release = current > previous
          
          print(f"should_release={str(should_release).lower()}")
          
          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'current_version={current_version}\n')
              f.write(f'previous_version={previous_version}\n')
              f.write(f'should_release={str(should_release).lower()}\n')
        shell: python3 {0}

      - name: Create Release
        if: steps.versions.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.versions.outputs.current_version }}
          name: Version ${{ steps.versions.outputs.current_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
