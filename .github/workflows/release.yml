name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-quality:
    name: Check Code Quality
    uses: ./.github/workflows/lint.yml

  check-validate:
    name: Check Validation
    uses: ./.github/workflows/validate.yml

  release:
    name: Create Release
    needs: [check-quality, check-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install packaging
        run: python3 -m pip install packaging

      - name: Get current and previous versions
        id: versions
        run: |
          import json
          from packaging import version
          import os
          
          # Get current version from manifest
          with open('custom_components/domru/manifest.json') as f:
              current_version = json.load(f)['version']
          
          print(f"current_version={current_version}")
          
          # Try to get the latest tag
          import subprocess
          try:
              latest_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0"],
                  stderr=subprocess.DEVNULL,
                  text=True
              ).strip()
              previous_version = latest_tag.lstrip('v')
          except subprocess.CalledProcessError:
              previous_version = "0.0.0"
          
          print(f"previous_version={previous_version}")
          
          # Compare versions
          current = version.parse(current_version)
          previous = version.parse(previous_version)
          should_release = current > previous
          
          print(f"should_release={str(should_release).lower()}")
          
          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'current_version={current_version}\n')
              f.write(f'previous_version={previous_version}\n')
              f.write(f'should_release={str(should_release).lower()}\n')
        shell: python3 {0}

      - name: Create Release
        if: steps.versions.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.versions.outputs.current_version }}
          name: Version ${{ steps.versions.outputs.current_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

